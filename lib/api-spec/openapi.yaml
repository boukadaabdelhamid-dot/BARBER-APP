openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: barbers
    description: Public mobile barber discovery and onboarding
  - name: bookings
    description: Booking requests
  - name: barberPortal
    description: Barber booking management
  - name: admin
    description: Protected barber profile review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /barbers:
    get:
      operationId: listBarbers
      tags: [barbers]
      summary: Find mobile barbers
      parameters:
        - name: city
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching barbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Barber"
    post:
      operationId: createBarber
      tags: [barbers]
      summary: Submit a mobile barber profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberInput"
      responses:
        "201":
          description: Profile submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSubmission"
  /barbers/{barberId}:
    get:
      operationId: getBarber
      tags: [barbers]
      summary: Get a barber profile
      parameters:
        - name: barberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Barber profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barber"
        "404":
          description: Barber not found
  /barber/session:
    get:
      operationId: getBarberSession
      tags: [barberPortal]
      summary: Check the current barber session
      responses:
        "200":
          description: Barber session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSession"
    post:
      operationId: loginBarber
      tags: [barberPortal]
      summary: Start a barber session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberCredentialsInput"
      responses:
        "200":
          description: Barber session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSession"
        "401":
          description: Invalid barber credentials
        "429":
          description: Too many login attempts
        "503":
          description: Barber authentication is not configured
    delete:
      operationId: logoutBarber
      tags: [barberPortal]
      summary: End the current barber session
      responses:
        "200":
          description: Barber session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSession"
  /barber/email-session:
    post:
      operationId: loginBarberByEmail
      tags: [barberPortal]
      summary: Start a barber session with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberEmailCredentialsInput"
      responses:
        "200":
          description: Barber session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSession"
        "401":
          description: Invalid barber credentials
        "429":
          description: Too many login attempts
        "503":
          description: Barber authentication is not configured
  /barber/password-recovery:
    post:
      operationId: recoverBarberPassword
      tags: [barberPortal]
      summary: Recover a barber password with the backup access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberPasswordRecoveryInput"
      responses:
        "200":
          description: Password and email updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberPasswordRecovery"
        "401":
          description: Invalid recovery credentials
        "409":
          description: Email already belongs to another barber
        "429":
          description: Too many recovery attempts
  /barber/bookings:
    get:
      operationId: listBarberBookings
      tags: [barberPortal]
      summary: List bookings for the signed-in barber
      responses:
        "200":
          description: Bookings owned by the current barber
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BarberBooking"
        "401":
          description: Barber authentication required
  /barber/availability:
    patch:
      operationId: updateBarberAvailability
      tags: [barberPortal]
      summary: Update availability and optional barber location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberAvailabilityInput"
      responses:
        "200":
          description: Updated availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSession"
        "400":
          description: Invalid availability or coordinates
        "401":
          description: Barber authentication required
  /barber/bookings/{bookingId}/status:
    patch:
      operationId: decideBarberBooking
      tags: [barberPortal]
      summary: Confirm or reject a booking request
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingDecisionInput"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberBooking"
        "401":
          description: Barber authentication required
        "404":
          description: Booking not found
        "409":
          description: Booking was already decided
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Request an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConfirmation"
        "400":
          description: Invalid booking input or missing location permission
        "409":
          description: No available barber covers this service and location
        "404":
          description: Barber or service not found
  /booking-status:
    get:
      operationId: getBookingStatus
      tags: [bookings]
      summary: Check a booking with its private tracking token
      parameters:
        - name: bookingId
          in: query
          required: true
          schema: { type: integer }
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "200":
          description: Booking status for the customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingTracking"
        "404":
          description: Booking not found
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
        "429":
          description: Too many login attempts
        "503":
          description: Admin authentication is not configured
    delete:
      operationId: logoutAdmin
      tags: [admin]
      summary: End the current admin session
      responses:
        "200":
          description: Admin session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/barbers:
    get:
      operationId: listPendingBarbers
      tags: [admin]
      summary: List barber profiles awaiting review
      responses:
        "200":
          description: Pending barber profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BarberReview"
        "401":
          description: Admin authentication required
  /admin/barbers/{barberId}/access-code:
    post:
      operationId: issueBarberAccessCode
      tags: [admin]
      summary: Issue a new login code for an active barber
      parameters:
        - name: barberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: One-time login code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberAccessCode"
        "401":
          description: Admin authentication required
        "404":
          description: Active barber not found
  /admin/barbers/{barberId}/status:
    patch:
      operationId: moderateBarber
      tags: [admin]
      summary: Approve or reject a pending barber profile
      parameters:
        - name: barberId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberDecisionInput"
      responses:
        "200":
          description: Updated barber profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberReview"
        "401":
          description: Admin authentication required
        "404":
          description: Pending profile not found
        "409":
          description: Profile was already reviewed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BarberService:
      type: object
      required: [id, name, durationMinutes, price]
      properties:
        id: { type: string }
        name: { type: string }
        durationMinutes: { type: integer }
        price: { type: number }
    Barber:
      type: object
      required: [id, name, city, areas, bio, rating, reviewCount, travelFee, currency, services, phone, status, isAvailable]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        areas:
          type: array
          items: { type: string }
        bio: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        travelFee: { type: number }
        currency: { type: string }
        phone: { type: string }
        imageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [active, pending, rejected] }
        isAvailable: { type: boolean }
        services:
          type: array
          items:
            $ref: "#/components/schemas/BarberService"
    BarberServiceInput:
      type: object
      required: [id, name, durationMinutes, price]
      properties:
        id: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 80 }
        durationMinutes: { type: integer, minimum: 10, maximum: 240 }
        price: { type: number, minimum: 0, maximum: 10000 }
    BarberInput:
      type: object
      required: [name, city, areas, bio, phone, email, password, travelFee, currency, services]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        city: { type: string, minLength: 2, maxLength: 100 }
        areas:
          type: array
          minItems: 1
          items: { type: string, minLength: 2, maxLength: 100 }
        bio: { type: string, minLength: 10, maxLength: 500 }
        phone: { type: string, minLength: 7, maxLength: 30 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        travelFee: { type: number, minimum: 0, maximum: 10000 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        services:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BarberServiceInput"
    BarberSubmission:
      type: object
      required: [id, status, message, accessCode]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending] }
        message: { type: string }
        accessCode: { type: string, minLength: 32, maxLength: 128 }
    BarberCredentialsInput:
      type: object
      required: [barberId, accessCode]
      properties:
        barberId: { type: integer }
        accessCode: { type: string, minLength: 32, maxLength: 128 }
    BarberEmailCredentialsInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    BarberPasswordRecoveryInput:
      type: object
      required: [barberId, accessCode, email, password]
      properties:
        barberId: { type: integer, minimum: 1 }
        accessCode: { type: string, minLength: 32, maxLength: 128 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    BarberPasswordRecovery:
      type: object
      required: [barberId, email, accessCode]
      properties:
        barberId: { type: integer }
        email: { type: string, format: email }
        accessCode: { type: string, minLength: 32, maxLength: 128 }
    BarberSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        barberId: { type: integer }
        barberName: { type: string }
        isAvailable: { type: boolean }
        hasLocation: { type: boolean }
    BarberAvailabilityInput:
      type: object
      required: [isAvailable]
      properties:
        isAvailable: { type: boolean }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
    BarberAccessCode:
      type: object
      required: [barberId, accessCode]
      properties:
        barberId: { type: integer }
        accessCode: { type: string, minLength: 32, maxLength: 128 }
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 512 }
    BarberReview:
      type: object
      required: [id, name, city, areas, bio, rating, reviewCount, travelFee, currency, services, phone, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        areas:
          type: array
          items: { type: string }
        bio: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        travelFee: { type: number }
        currency: { type: string }
        phone: { type: string }
        imageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [active, pending, rejected] }
        services:
          type: array
          items:
            $ref: "#/components/schemas/BarberService"
        createdAt: { type: string, format: date-time }
    BarberDecisionInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, rejected] }
    BookingInput:
      type: object
      required: [serviceName, city, locationMode, customerName, customerPhone, date, time]
      properties:
        serviceName: { type: string, minLength: 2, maxLength: 80 }
        city: { type: string, minLength: 2, maxLength: 100 }
        locationMode: { type: string, enum: [manual, gps] }
        customerName: { type: string, minLength: 2, maxLength: 100 }
        customerPhone: { type: string, minLength: 7, maxLength: 30 }
        area: { type: ["string", "null"], minLength: 2, maxLength: 120 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        date: { type: string, format: date }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        note: { type: ["string", "null"], maxLength: 500 }
    BookingConfirmation:
      type: object
      required: [id, status, barberName, barberPhone, serviceName, servicePrice, travelFee, currency, date, time, trackingToken, attemptCount]
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested] }
        barberName: { type: string }
        barberPhone: { type: string }
        serviceName: { type: string }
        servicePrice: { type: number }
        travelFee: { type: number }
        currency: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        trackingToken: { type: string, minLength: 32, maxLength: 128 }
        attemptCount: { type: integer }
    BookingDecisionInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [confirmed, rejected] }
    BarberBooking:
      type: object
      required: [id, status, serviceName, servicePrice, currency, customerName, customerPhone, area, date, time, note, createdAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested, confirmed, rejected, unavailable] }
        serviceName: { type: string }
        servicePrice: { type: number }
        currency: { type: string }
        customerName: { type: string }
        customerPhone: { type: string }
        area: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    BookingTracking:
      type: object
      required: [id, status, barberName, serviceName, date, time, attemptCount, lastAttemptReason]
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested, confirmed, rejected, unavailable] }
        barberName: { type: ["string", "null"] }
        serviceName: { type: string }
        date: { type: string, format: date }
        time: { type: string }
        attemptCount: { type: integer }
        lastAttemptReason: { type: ["string", "null"], enum: [rejected, timeout, null] }

