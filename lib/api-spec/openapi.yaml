openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: barbers
    description: Public mobile barber discovery and onboarding
  - name: bookings
    description: Booking requests
  - name: admin
    description: Protected barber profile review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /barbers:
    get:
      operationId: listBarbers
      tags: [barbers]
      summary: Find mobile barbers
      parameters:
        - name: city
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching barbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Barber"
    post:
      operationId: createBarber
      tags: [barbers]
      summary: Submit a mobile barber profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberInput"
      responses:
        "201":
          description: Profile submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSubmission"
  /barbers/{barberId}:
    get:
      operationId: getBarber
      tags: [barbers]
      summary: Get a barber profile
      parameters:
        - name: barberId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Barber profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barber"
        "404":
          description: Barber not found
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Request an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConfirmation"
        "404":
          description: Barber or service not found
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
        "429":
          description: Too many login attempts
        "503":
          description: Admin authentication is not configured
    delete:
      operationId: logoutAdmin
      tags: [admin]
      summary: End the current admin session
      responses:
        "200":
          description: Admin session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/barbers:
    get:
      operationId: listPendingBarbers
      tags: [admin]
      summary: List barber profiles awaiting review
      responses:
        "200":
          description: Pending barber profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BarberReview"
        "401":
          description: Admin authentication required
  /admin/barbers/{barberId}/status:
    patch:
      operationId: moderateBarber
      tags: [admin]
      summary: Approve or reject a pending barber profile
      parameters:
        - name: barberId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberDecisionInput"
      responses:
        "200":
          description: Updated barber profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberReview"
        "401":
          description: Admin authentication required
        "404":
          description: Pending profile not found
        "409":
          description: Profile was already reviewed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BarberService:
      type: object
      required: [id, name, durationMinutes, price]
      properties:
        id: { type: string }
        name: { type: string }
        durationMinutes: { type: integer }
        price: { type: number }
    Barber:
      type: object
      required: [id, name, city, areas, bio, rating, reviewCount, travelFee, currency, services, phone, status]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        areas:
          type: array
          items: { type: string }
        bio: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        travelFee: { type: number }
        currency: { type: string }
        phone: { type: string }
        imageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [active, pending, rejected] }
        services:
          type: array
          items:
            $ref: "#/components/schemas/BarberService"
    BarberServiceInput:
      type: object
      required: [id, name, durationMinutes, price]
      properties:
        id: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 80 }
        durationMinutes: { type: integer, minimum: 10, maximum: 240 }
        price: { type: number, minimum: 0, maximum: 10000 }
    BarberInput:
      type: object
      required: [name, city, areas, bio, phone, travelFee, currency, services]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        city: { type: string, minLength: 2, maxLength: 100 }
        areas:
          type: array
          minItems: 1
          items: { type: string, minLength: 2, maxLength: 100 }
        bio: { type: string, minLength: 10, maxLength: 500 }
        phone: { type: string, minLength: 7, maxLength: 30 }
        travelFee: { type: number, minimum: 0, maximum: 10000 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        services:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BarberServiceInput"
    BarberSubmission:
      type: object
      required: [id, status, message]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending] }
        message: { type: string }
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 512 }
    BarberReview:
      type: object
      required: [id, name, city, areas, bio, rating, reviewCount, travelFee, currency, services, phone, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        city: { type: string }
        areas:
          type: array
          items: { type: string }
        bio: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        travelFee: { type: number }
        currency: { type: string }
        phone: { type: string }
        imageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [active, pending, rejected] }
        services:
          type: array
          items:
            $ref: "#/components/schemas/BarberService"
        createdAt: { type: string, format: date-time }
    BarberDecisionInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, rejected] }
    BookingInput:
      type: object
      required: [barberId, serviceId, customerName, customerPhone, area, date, time]
      properties:
        barberId: { type: integer }
        serviceId: { type: string, minLength: 1, maxLength: 40 }
        customerName: { type: string, minLength: 2, maxLength: 100 }
        customerPhone: { type: string, minLength: 7, maxLength: 30 }
        area: { type: string, minLength: 2, maxLength: 120 }
        date: { type: string, format: date }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        note: { type: ["string", "null"], maxLength: 500 }
    BookingConfirmation:
      type: object
      required: [id, status, barberName, serviceName, date, time]
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested] }
        barberName: { type: string }
        serviceName: { type: string }
        date: { type: string, format: date }
        time: { type: string }

